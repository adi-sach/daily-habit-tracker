{% extends "layout.html" %}

{% block content %}

<h2 class="mb-4">Habit History</h2>

{% if logs %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Habit</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
                <tr>
                    <td>{{ log.date }}</td>
                    <td>{{ log.name }}</td>
                    <td>
                        {% if log.completed %}
                            <span class="badge bg-success">Completed</span>
                        {% else %}
                            <span class="badge bg-danger">Not Completed</span>
                        {% endif %}
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No history available yet.</p>
{% endif %}

{% endblock %}
